name: spec-driven
version: 1
description: 默认 OpenSpec 工作流 - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: 说明变更动机、范围、能力影响和架构影响初筛的初始提案
    template: proposal.md
    instruction: |
      创建 proposal 文档，先说明 WHY/WHAT，再做轻量架构影响初筛。默认使用简体中文撰写；命令、路径、代码标识符、API 名称、JSON/YAML key 保持英文。

      章节要求：
      - **Why**：用 1-2 段说明问题或机会。它解决什么问题？为什么现在要做？
      - **What Changes**：用 bullet list 描述变更内容，明确新增、修改或移除的能力。破坏性变更标记 **BREAKING**。
      - **Capabilities**：识别需要创建或修改的 specs：
        - **New Capabilities**：列出新增 capability。每一项会对应 `specs/<name>/spec.md`。名称使用 kebab-case（例如 `user-auth`、`data-export`）。
        - **Modified Capabilities**：列出现有 capability 中 REQUIREMENTS 会变化的项。只在 spec-level 行为变化时列出，不包含纯实现细节。每项需要 delta spec file。先检查 `openspec/specs/` 中已有 spec 名称。
      - **Architecture Impact**：做架构影响初筛，识别相关现有 specs、模块、共享能力、数据模型、配置、部署或测试模式；不要在 proposal 中展开具体实现。
      - **Impact**：受影响的代码、API、依赖或系统。

      重要：Capabilities 是 proposal 与 specs 阶段之间的契约。填写前必须先检查现有 specs。这里列出的每个 capability 都需要对应 spec file。

      保持简洁（1-2 页）。proposal 关注 WHY/WHAT 和影响范围，具体 HOW 放入 design.md。

      这是后续 specs、design 和 tasks 的基础。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 定义变更 WHAT 的详细规格
    template: spec.md
    instruction: |
      创建 specification files，定义系统应该做什么。默认使用简体中文撰写；命令、路径、代码标识符、API 名称、JSON/YAML key 保持英文。

      按 proposal 的 Capabilities section，为每个 capability 创建一个 spec file。
      - New capabilities：使用 proposal 中完全一致的 kebab-case 名称（specs/<capability>/spec.md）。
      - Modified capabilities：使用 `openspec/specs/<capability>/` 中已有 spec folder 名称，在 `specs/<capability>/spec.md` 创建 delta spec。

      Delta operations（必须使用以下英文 ## headers）：
      - **ADDED Requirements**：新增 capability 或 requirement
      - **MODIFIED Requirements**：行为变化，必须包含完整更新后的 requirement 内容
      - **REMOVED Requirements**：废弃能力，必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**：仅名称变化，使用 FROM:/TO: 格式

      格式要求：
      - 每个 requirement：`### Requirement: <name>` 后跟描述
      - 规范性要求使用 SHALL/MUST（避免 should/may）
      - 每个 scenario：`#### Scenario: <name>`，使用 WHEN/THEN 格式
      - **CRITICAL**：Scenario 必须使用 4 个井号（`####`）。使用 3 个井号或 bullet 会导致解析失败。
      - 每个 requirement 必须至少有一个 scenario。

      MODIFIED requirements 工作流：
      1. 在 `openspec/specs/<capability>/spec.md` 中找到现有 requirement
      2. 复制完整 requirement block（从 `### Requirement:` 到所有 scenarios）
      3. 粘贴到 `## MODIFIED Requirements` 下，并修改为新行为
      4. 确保 header text 完全匹配（忽略空白）

      常见错误：在 MODIFIED 中只写部分内容会在 archive 时丢失细节。如果只是增加新关注点而不改变既有行为，使用 ADDED。

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs 应可测试；每个 scenario 都应能转化为潜在测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 说明技术方案、架构评估、关键决策和取舍的设计文档
    template: design.md
    instruction: |
      创建 design 文档，说明 HOW，并从架构角度评估方案。默认使用简体中文撰写；命令、路径、代码标识符、API 名称、JSON/YAML key 保持英文。

      何时需要 design.md（任一条件满足即创建）：
      - 跨多个服务/模块的变更，或引入新的架构模式
      - 新外部依赖，或重要数据模型变化
      - 涉及安全、性能、迁移、部署或兼容性复杂度
      - 编码前需要明确技术决策的模糊点
      - proposal 的 Architecture Impact 显示存在共享能力、边界、所有权或质量属性影响

      章节要求：
      - **Context**：背景、当前状态、约束、stakeholders
      - **Goals / Non-Goals**：本设计要达成和明确排除的内容
      - **Architecture Assessment**：复用现有设计、边界与职责、方案选择、质量属性、复杂度与例外
      - **Decisions**：关键技术选择与理由（为什么选 X 而不是 Y），每个决策包含替代方案
      - **Risks / Trade-offs**：已知限制、风险与缓解方式。格式：[Risk] -> Mitigation
      - **Migration Plan**：部署步骤和回滚策略（如适用）
      - **Open Questions**：待解决问题

      重点是架构和方案，不是逐行实现。必须先评估能否复用已有 specs、模块、接口、服务、配置、测试模式和部署约束，再决定是否新增抽象、依赖、服务、存储或协议。

      好的 design 文档解释技术决策背后的 why，并把关键架构约束转化为后续 tasks 中可验证的工作。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 可跟踪的实现与验证任务清单
    template: tasks.md
    instruction: |
      创建 task list，将实现工作和必要验证拆成可跟踪任务。默认使用简体中文撰写；命令、路径、代码标识符、API 名称、JSON/YAML key 保持英文。

      **IMPORTANT: 必须严格遵循模板格式。** apply 阶段会解析 checkbox 来跟踪进度。未使用 `- [ ]` 的任务不会被跟踪。

      指导原则：
      - 相关任务放在 `##` 编号 heading 下
      - 每个任务必须是 checkbox：`- [ ] X.Y Task description`
      - 任务应小到能在一个 session 中完成
      - 按依赖顺序排列（什么必须先完成？）
      - 从 design.md 的 Architecture Assessment 和 Decisions 派生必要验证任务
      - 对架构显著约束增加 contract/integration/e2e、lint/static check、迁移兼容、回滚或关键错误路径验证
      - 不要只有实现任务；如果 design 中有架构约束，必须有对应验证任务

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      ```

      参考 specs 确定需要构建什么，参考 design 确定如何构建。每个任务都应可验证，完成标准要清晰。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    读取上下文文件，按顺序完成待办任务，并在完成时标记 checkbox。
    实现时必须遵守 design.md 中的架构决策和验证要求。
    遇到 blocker 或需要澄清时暂停。
