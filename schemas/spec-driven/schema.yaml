name: spec-driven
version: 1
description: 默认 OpenSpec 工作流 - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: 说明变更动机、范围、能力影响和架构影响初筛的初始提案
    template: proposal.md
    instruction: |
      创建 proposal 文档，说明 WHY/WHAT 和影响范围；具体 HOW 放入 design.md。保持简洁（1-2 页）。

      章节要求：
      - **Why**：用 1-2 段说明问题或机会。它解决什么问题？为什么现在要做？
      - **What Changes**：用 bullet list 描述变更内容，明确新增、修改或移除的能力。破坏性变更标记 **BREAKING**。
      - **Capabilities**：识别需要创建或修改的 specs（这是 proposal 与 specs 阶段之间的契约，填写前必须先检查 `openspec/specs/` 中的现有 specs）：
        - **New Capabilities**：新增 capability，每一项对应 `specs/<name>/spec.md`，名称使用 kebab-case（例如 `user-auth`、`data-export`）。
        - **Modified Capabilities**：现有 capability 中 REQUIREMENTS 会变化的项。只在 spec-level 行为变化时列出，不包含纯实现细节。
      - **Architecture Impact**：架构影响初筛——识别相关的现有模块、共享能力、数据模型、配置或部署约束。无显著架构影响时一句话说明即可，不要为凑格式展开。
      - **Impact**：受影响的代码、API、依赖或系统。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 定义变更 WHAT 的详细规格
    template: spec.md
    instruction: |
      创建 specification files，定义系统应该做什么。按 proposal 的 Capabilities section，为每个 capability 创建一个 spec file。
      - New capabilities：使用 proposal 中完全一致的 kebab-case 名称（specs/<capability>/spec.md）。
      - Modified capabilities：使用 `openspec/specs/<capability>/` 中已有 spec folder 名称，创建 delta spec。

      Delta operations（必须使用以下英文 ## headers，archive 合并依赖这些解析）：
      - **ADDED Requirements**：新增 capability 或 requirement
      - **MODIFIED Requirements**：行为变化，必须包含完整更新后的 requirement 内容
      - **REMOVED Requirements**：废弃能力，必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**：仅名称变化，使用 FROM:/TO: 格式

      格式要求：
      - 每个 requirement：`### Requirement: <name>` 后跟描述，规范性要求使用 SHALL/MUST
      - 每个 requirement 至少一个 scenario：`#### Scenario: <name>`，使用 WHEN/THEN 格式
      - **CRITICAL**：Scenario 必须使用 4 个井号（`####`）。使用 3 个井号或 bullet 会导致解析失败。

      MODIFIED requirements 工作流：
      1. 在 `openspec/specs/<capability>/spec.md` 中找到现有 requirement
      2. 复制完整 requirement block（从 `### Requirement:` 到所有 scenarios）
      3. 粘贴到 `## MODIFIED Requirements` 下，并修改为新行为（header text 需完全匹配，忽略空白）

      常见错误：在 MODIFIED 中只写部分内容会在 archive 时丢失细节。如果只是增加新关注点而不改变既有行为，使用 ADDED。

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs 应可测试；每个 scenario 都应能转化为潜在测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 说明技术方案、架构评估、关键决策和取舍的设计文档
    template: design.md
    instruction: |
      创建 design 文档，说明 HOW。评估深度与变更的架构显著性成正比：

      - **显著变更**（跨模块、改共享契约、新依赖、涉及迁移/安全/性能/兼容性，或存在需要取舍的技术决策）：完整展开各章节——先评估能否复用已有 specs、模块、接口、配置和测试模式，再决定是否新增抽象、依赖、服务、存储或协议；记录关键决策及替代方案（为什么选 X 而不是 Y）；把关键架构约束转化为 tasks 中可验证的工作。
      - **简单变更**（在既有模式内的局部修改，无新决策）：极简即可——在 Context 中一两句话说明复用现状，其余章节标注 N/A。不要为凑格式编造内容。

      重点是架构和方案，不是逐行实现。好的 design 文档解释技术决策背后的 why。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 可跟踪的实现与验证任务清单
    template: tasks.md
    instruction: |
      创建 task list，将实现工作和必要验证拆成可跟踪任务。

      **IMPORTANT: 必须严格遵循模板格式。** apply 阶段会解析 checkbox 来跟踪进度。未使用 `- [ ]` 的任务不会被跟踪。

      指导原则：
      - 相关任务放在 `##` 编号 heading 下
      - 每个任务必须是 checkbox：`- [ ] X.Y Task description`
      - 任务应小到能在一个 session 中完成，按依赖顺序排列
      - 如果 design.md 中有架构决策或约束，为其增加对应验证任务（如 contract/integration 测试、迁移兼容、回滚验证）；简单变更不需要额外仪式

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities

      ## 3. Verification

      - [ ] 3.1 Add integration coverage for the export endpoint
      ```

      参考 specs 确定需要构建什么，参考 design 确定如何构建。每个任务都应可验证，完成标准要清晰。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    读取上下文文件后完成待办任务。每轮开始前重读 tasks.md；每个任务取得验证证据后立即把 checkbox 标记为 `- [x]`，然后再次重读 tasks.md 再选择下一项。
    实现必须遵守 design.md 中已记录的决策；发现决策不可行时，先更新 artifacts 再继续，不要绕过设计直接实现。
    主动识别并充分使用 sub-agent 处理互不冲突的调研、测试、验证和隔离实现；共享文件、接口、架构决策、最终集成和 checkbox 更新由主 agent 负责。
    错误优先自行修复；需要用户决策时给出 2-3 个互斥选项、推荐项及取舍。
    全部任务完成后继续最终验证、必要文档更新、archive 和 scoped Git commit；用户明确限制范围或仓库规则/权限阻塞时除外。push、发布或部署仅在用户明确要求时执行。
